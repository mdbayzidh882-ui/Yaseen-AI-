name: Build Sathi Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
               -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore
          keytool -list -keystore debug.keystore -storepass android >/dev/null

      - name: Set up Android SDK 36.1 and licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -un):$(id -gn)" "$SDK_ROOT"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at: $SDK_ROOT"

          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_ROOT/licenses/google-gdk-license"

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
              SDK_LIST="$("$SDKMANAGER" --sdk_root="$SDK_ROOT" --list 2>&1 || true)"
              if ! printf '%s\n' "$SDK_LIST" | grep -F "platforms;android-36.1" >/dev/null; then
                echo "Updating cmdline-tools to fetch android-36.1..."
                yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest" || true
                if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
                  SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
                fi
                yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              fi
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || \
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=1 --install "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || \
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=2 --install "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
            fi
          fi
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            echo "ERROR: platforms/android-36.1 was not installed!"
            if [ -n "$SDKMANAGER" ]; then
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list | grep -E "platforms;android-36|build-tools;36" || true
            fi
            exit 1
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.parallel=false 2>&1 | tee gradle-build.log
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Summarize error on failure
        if: failure()
        run: |
          {
            echo "### Build Failure Details"
            echo '```text'
            if [ -f gradle-build.log ]; then
              tail -n 60 gradle-build.log
            else
              echo "Failed before Gradle build started."
            fi
            echo '```'
            echo "### Runner Memory & Disk"
            echo '```text'
            free -m || true
            df -h || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Sathi Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Sathi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
